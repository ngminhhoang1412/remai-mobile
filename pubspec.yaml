name: remai
description: "remai mobile client (iOS and Android): page tree, block editor, search and trash."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0 <3.45.0"

# Keep this list to the packages approved in remai-central-specs design D8.
# Versions are caret ranges; pubspec.lock is committed and is what builds use.
dependencies:
  flutter:
    sdk: flutter
  # 17.x: 18.x moved to the standalone material_ui package, which would not
  # recognise this app's package:flutter MaterialApp (see AGENTS.md).
  go_router: ^17.5.0
  provider: ^6.1.5+1
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
